name: Weekly data refresh (deep)

# Deep weekly scrape (more pages) to pick up genuinely new products. The upsert
# merges these into the same snapshot the daily shallow run maintains.
on:
  schedule:
    - cron: "30 18 * * 0"   # 18:30 UTC Sunday = 00:00 IST Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Scrape Flipkart — full depth (keep last good snapshot if blocked)
        run: python -m etl.scrape --pages 60 --min-rows 1000

      - name: Rebuild catalog (sanity check)
        run: python -m etl.pipeline

      - name: Commit refreshed snapshot
        run: |
          git config user.name "gaurang garg"
          git config user.email "gauranggarg@gmail.com"
          git add data/flipkart_electronics_raw.csv
          git diff --staged --quiet && exit 0
          git commit -m "chore: weekly deep data refresh [skip ci]"
          # The deep scrape runs ~1h; the daily run may push in the meantime, so
          # rebase onto the latest remote (keeping our freshly scraped CSV) and
          # retry a few times before giving up.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          echo "::error::push failed after 5 retries" && exit 1
